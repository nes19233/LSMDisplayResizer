# Hält GitHub Actions und NuGet-Pakete (Testprojekt, Installer) aktuell.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: nuget
    directories:
      - /
      - /installer
    schedule:
      interval: monthly
    groups:
      packages:
        patterns: ["*"]
    ignore:
      # WiX ab Version 6 verlangt von Organisationen mit Umsatz die "Open Source Maintenance Fee".
      # Wechsel nur bewusst, nicht automatisch.
      - dependency-name: "WixToolset.*"
        update-types: ["version-update:semver-major"]

name: Build

# Baut und testet bei jedem Push auf main und bei Pull Requests.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build LSMDisplayResizer.slnx -c Release

      - name: Tests
        run: dotnet test LSMDisplayResizer.slnx -c Release --no-build

      - name: MSI bauen (Prüfung, dass der Installer baut)
        shell: pwsh
        run: |
          dotnet publish src/LSMDisplayResizer/LSMDisplayResizer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
          dotnet build installer/LSMDisplayResizer.Installer.wixproj -c Release "-p:AppPublishDir=$PWD\publish\"

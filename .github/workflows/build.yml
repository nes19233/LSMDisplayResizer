name: Build

# Baut und testet bei jedem Push auf main und bei Pull Requests.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build LSMDisplayResizer.slnx -c Release

      - name: Tests
        run: dotnet test LSMDisplayResizer.slnx -c Release --no-build

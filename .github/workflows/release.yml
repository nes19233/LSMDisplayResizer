name: Release

# Baut bei einem Tag v* (z. B. v1.0.0) MSI und Single-File-EXE und lädt sie als GitHub-Release hoch.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v7

      - name: .NET 10 einrichten
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Version aus dem Tag ermitteln
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Tag '${{ github.ref_name }}' ist keine gültige Version (erwartet z. B. v1.2.3)."
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Tests
        run: dotnet test tests/LSMDisplayResizer.Tests/LSMDisplayResizer.Tests.csproj -c Release

      - name: Single-File-EXE bauen (win-x64, self-contained)
        run: >
          dotnet publish src/LSMDisplayResizer/LSMDisplayResizer.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:Version=${{ env.VERSION }}
          -o publish

      - name: MSI bauen
        shell: pwsh
        run: dotnet build installer/LSMDisplayResizer.Installer.wixproj -c Release "-p:Version=$env:VERSION" "-p:AppPublishDir=$PWD\publish\"

      - name: Dateien für das Release zusammenstellen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item publish/LSMDisplayResizer.exe "dist/LSMDisplayResizer-$env:VERSION-win-x64.exe"
          $msi = Get-ChildItem installer/bin -Recurse -Filter LSMDisplayResizer.msi | Select-Object -First 1
          Copy-Item $msi.FullName "dist/LSMDisplayResizer-$env:VERSION-win-x64.msi"
          # Unix-Zeilenenden, damit "sha256sum -c SHA256SUMS.txt" auch unter Linux/macOS funktioniert
          $lines = Get-ChildItem dist -Filter 'LSMDisplayResizer-*' | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" }
          [IO.File]::WriteAllText("$PWD/dist/SHA256SUMS.txt", ($lines -join "`n") + "`n")

      - name: Release erstellen
        uses: softprops/action-gh-release@v3
        with:
          name: LSM Display Resizer ${{ env.VERSION }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/LSMDisplayResizer-${{ env.VERSION }}-win-x64.msi
            dist/LSMDisplayResizer-${{ env.VERSION }}-win-x64.exe
            dist/SHA256SUMS.txt

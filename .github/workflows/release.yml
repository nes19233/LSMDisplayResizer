name: Release

# Baut bei einem Tag v* (z. B. v1.0.0) eine Single-File-EXE und lädt sie als GitHub-Release hoch.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v5

      - name: .NET 10 einrichten
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Version aus dem Tag ermitteln
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Tag '${{ github.ref_name }}' ist keine gültige Version (erwartet z. B. v1.2.3)."
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Tests
        run: dotnet test tests/LSMDisplayResizer.Tests/LSMDisplayResizer.Tests.csproj -c Release

      - name: Single-File-EXE bauen (win-x64, self-contained)
        run: >
          dotnet publish src/LSMDisplayResizer/LSMDisplayResizer.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:Version=${{ env.VERSION }}
          -o publish

      - name: EXE umbenennen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item publish/LSMDisplayResizer.exe "dist/LSMDisplayResizer-$env:VERSION-win-x64.exe"
          Get-FileHash "dist/LSMDisplayResizer-$env:VERSION-win-x64.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  LSMDisplayResizer-$env:VERSION-win-x64.exe" } |
            Set-Content "dist/SHA256SUMS.txt"

      - name: Release erstellen
        uses: softprops/action-gh-release@v3
        with:
          name: LSM Display Resizer ${{ env.VERSION }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/LSMDisplayResizer-${{ env.VERSION }}-win-x64.exe
            dist/SHA256SUMS.txt
